name: alyak
description: "Allyak — Korean family supplement caring app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Secure storage & encryption
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3

  # Notifications
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^4.1.0
  timezone: ^0.10.0

  # Utilities
  url_launcher: ^6.3.1
  intl: ^0.20.1
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  collection: ^1.19.0
  http: ^1.2.2
  crypto: ^3.0.6
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/supplement_guide.json
    - assets/data/symptom_guide.json
    - assets/data/age_group_recommendations.json
    - assets/data/combination_optimizer.json
    - assets/data/products.json
    - assets/images/
    - assets/images/products/
